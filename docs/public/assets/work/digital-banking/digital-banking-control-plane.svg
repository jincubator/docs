<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" role="img" aria-labelledby="title desc">
  <title id="title">Digital Banking Control Plane Reference Architecture</title>
  <desc id="desc">A non-production reference architecture showing API composition, domain and application boundaries, PostgreSQL outbox delivery, signing and chain ports, observation, reconciliation, and distinct finalities.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020711"/>
      <stop offset="0.56" stop-color="#071426"/>
      <stop offset="1" stop-color="#020711"/>
    </linearGradient>
    <radialGradient id="halo" cx="82%" cy="12%" r="72%">
      <stop offset="0" stop-color="#1f9cff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#020711" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#35a0ff" stroke-opacity="0.07" stroke-width="1.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#b7c5d9"/>
    </marker>
    <marker id="limeArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#96e22a"/>
    </marker>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#21d4ff" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font-family: "DIN Condensed", "Arial Narrow", Arial, sans-serif; font-size: 132px; font-weight: 900; }
      .eyebrow { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 8px; }
      .section { font-family: "Arial Narrow", Arial, sans-serif; font-size: 36px; font-weight: 900; letter-spacing: 1.5px; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 29px; font-weight: 600; }
      .bodySmall { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 600; }
      .micro { font-family: Arial, Helvetica, sans-serif; font-size: 21px; font-weight: 700; letter-spacing: 1px; }
      .footer { font-family: Arial, Helvetica, sans-serif; font-size: 28px; }
      .muted { fill: #b7c5d9; }
      .text { fill: #f4f8ff; }
    </style>
  </defs>

  <rect width="3840" height="2160" fill="url(#bg)"/>
  <rect width="3840" height="2160" fill="url(#halo)"/>
  <rect width="3840" height="2160" fill="url(#grid)"/>

  <rect x="118" y="78" width="18" height="78" rx="9" fill="#96e22a"/>
  <text x="172" y="126" class="eyebrow" fill="#96e22a">OPTIONAL TECHNICAL DEEP DIVE</text>
  <text x="118" y="292" class="title" fill="#f4f8ff">DIGITAL BANKING CONTROL PLANE</text>
  <line x1="118" y1="342" x2="3722" y2="342" stroke="#96e22a" stroke-opacity="0.62" stroke-width="4"/>
  <text x="118" y="426" class="section" fill="#21d4ff">REFERENCE ARCHITECTURE / DURABLE AUTHORITY, EXTERNAL EVIDENCE</text>
  <text x="118" y="474" class="body muted">One Java control plane retains business truth; signing, chains, banks, accounting, and observations remain explicit boundaries.</text>

  <!-- Core topology -->
  <rect x="118" y="540" width="750" height="430" rx="24" fill="#071426" stroke="#21d4ff" stroke-width="3"/>
  <text x="160" y="608" class="section" fill="#21d4ff">API + COMPOSITION</text>
  <line x1="160" y1="632" x2="826" y2="632" stroke="#21d4ff" stroke-opacity="0.5" stroke-width="2"/>
  <text x="160" y="698" class="body text">TOKEN OPERATIONS</text>
  <text x="160" y="740" class="body text">TRANSFERS / USDZELLE</text>
  <text x="160" y="804" class="bodySmall muted">• Principal-derived participant scope</text>
  <text x="160" y="842" class="bodySmall muted">• Versioned idempotency and exact input</text>
  <text x="160" y="880" class="bodySmall muted">• Durable acceptance before response</text>
  <rect x="160" y="904" width="614" height="34" rx="17" fill="#0a203d"/>
  <text x="467" y="928" class="micro" text-anchor="middle" fill="#21d4ff">SPRING CONTROLLERS / COMPOSITION ROOT</text>

  <rect x="930" y="540" width="1210" height="430" rx="24" fill="#071426" stroke="#96e22a" stroke-width="3" filter="url(#softGlow)"/>
  <text x="972" y="608" class="section" fill="#96e22a">DOMAIN + APPLICATION</text>
  <line x1="972" y1="632" x2="2098" y2="632" stroke="#96e22a" stroke-opacity="0.5" stroke-width="2"/>
  <text x="972" y="698" class="body text">PLAIN-JAVA AGGREGATES + GUARDED LIFECYCLE</text>
  <text x="972" y="748" class="bodySmall muted">Operation / transfer / workflow identity • exact quantity • policy and approval evidence</text>
  <rect x="972" y="786" width="532" height="120" rx="18" fill="#04101f" stroke="#96e22a" stroke-opacity="0.58" stroke-width="2"/>
  <text x="1004" y="832" class="section" fill="#96e22a">DURABLE FACTS</text>
  <text x="1004" y="872" class="bodySmall muted">attempts • transitions • evidence</text>
  <rect x="1538" y="786" width="560" height="120" rx="18" fill="#04101f" stroke="#b35cff" stroke-opacity="0.62" stroke-width="2"/>
  <text x="1570" y="832" class="section" fill="#b35cff">APPLICATION PORTS</text>
  <text x="1570" y="872" class="bodySmall muted">policy • signer • chain • bank • accounting</text>
  <text x="972" y="940" class="micro" fill="#96e22a">DEPENDENCY DIRECTION: ADAPTERS + CONTROL PLANE → APPLICATION PORTS → DOMAIN</text>

  <rect x="2202" y="540" width="1520" height="430" rx="24" fill="#071426" stroke="#ff8a22" stroke-width="3"/>
  <text x="2244" y="608" class="section" fill="#ff8a22">DURABLE EXECUTION</text>
  <line x1="2244" y1="632" x2="3680" y2="632" stroke="#ff8a22" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="2244" y="678" width="664" height="216" rx="18" fill="#04101f" stroke="#21d4ff" stroke-opacity="0.62" stroke-width="2"/>
  <text x="2276" y="726" class="section" fill="#21d4ff">POSTGRES + OUTBOX</text>
  <text x="2276" y="766" class="bodySmall muted">operations • histories • finalities</text>
  <text x="2276" y="802" class="bodySmall muted">atomic acceptance • migrations</text>
  <text x="2276" y="838" class="bodySmall muted">retained evidence and recovery state</text>
  <rect x="2942" y="678" width="738" height="216" rx="18" fill="#04101f" stroke="#ff8a22" stroke-opacity="0.72" stroke-width="2"/>
  <text x="2974" y="726" class="section" fill="#ff8a22">DELIVERY + RECOVERY</text>
  <text x="2974" y="766" class="bodySmall muted">claim lease • handler outside transaction</text>
  <text x="2974" y="802" class="bodySmall muted">retry schedule • recovered lease</text>
  <text x="2974" y="838" class="bodySmall muted">ambiguity / exhaustion → manual review</text>
  <text x="2244" y="936" class="micro" fill="#ff8a22">EXTERNAL EFFECTS DO NOT OCCUR INSIDE THE DATABASE TRANSACTION</text>

  <line x1="868" y1="755" x2="930" y2="755" stroke="#b7c5d9" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="2140" y1="755" x2="2202" y2="755" stroke="#b7c5d9" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- External boundaries -->
  <text x="118" y="1040" class="section" fill="#b7c5d9">EXTERNAL EFFECT BOUNDARIES / APPLICATION-OWNED PORTS</text>
  <line x1="118" y1="1065" x2="3722" y2="1065" stroke="#36506f" stroke-width="2"/>

  <rect x="118" y="1104" width="720" height="292" rx="22" fill="#071426" stroke="#b35cff" stroke-width="3"/>
  <text x="156" y="1162" class="section" fill="#b35cff">SIGNER PORT</text>
  <text x="156" y="1210" class="body text">PROVIDER-NEUTRAL AUTHORITY</text>
  <text x="156" y="1252" class="bodySmall muted">durable request + attempt identity</text>
  <text x="156" y="1288" class="bodySmall muted">exact EVM digest / Solana message</text>
  <text x="156" y="1324" class="bodySmall muted">inquiry after ambiguity; no raw key in core</text>

  <rect x="876" y="1104" width="1000" height="292" rx="22" fill="#071426" stroke="#21d4ff" stroke-width="3"/>
  <text x="914" y="1162" class="section" fill="#21d4ff">CHAIN PORTS</text>
  <rect x="914" y="1200" width="428" height="150" rx="16" fill="#04101f" stroke="#21d4ff" stroke-opacity="0.58" stroke-width="2"/>
  <text x="946" y="1245" class="section" fill="#21d4ff">ETHEREUM / WEB3J</text>
  <text x="946" y="1284" class="bodySmall muted">nonce • receipt • canonicality</text>
  <text x="946" y="1320" class="bodySmall muted">submission + inquiry</text>
  <rect x="1384" y="1200" width="450" height="150" rx="16" fill="#04101f" stroke="#b35cff" stroke-opacity="0.62" stroke-width="2"/>
  <text x="1416" y="1245" class="section" fill="#b35cff">SOLANA / SAVA</text>
  <text x="1416" y="1284" class="bodySmall muted">blockhash • slot • commitment</text>
  <text x="1416" y="1320" class="bodySmall muted">native message semantics</text>

  <rect x="1914" y="1104" width="764" height="292" rx="22" fill="#071426" stroke="#96e22a" stroke-width="3"/>
  <text x="1952" y="1162" class="section" fill="#96e22a">BANK + ACCOUNTING PORTS</text>
  <text x="1952" y="1210" class="body text">SYNTHETIC LOCAL EFFECTS</text>
  <text x="1952" y="1252" class="bodySmall muted">source / destination bank inquiry</text>
  <text x="1952" y="1288" class="bodySmall muted">reserve, supply, custody, postings</text>
  <text x="1952" y="1324" class="bodySmall muted">evidence consumption + reconciliation</text>

  <rect x="2716" y="1104" width="1006" height="292" rx="22" fill="#071426" stroke="#ff8a22" stroke-width="3"/>
  <text x="2754" y="1162" class="section" fill="#ff8a22">OBSERVATION + RECONCILIATION</text>
  <text x="2754" y="1210" class="body text">INDEPENDENT EVIDENCE, NOT RESPONSE SUCCESS</text>
  <text x="2754" y="1252" class="bodySmall muted">observe native effect • retain evidence schema</text>
  <text x="2754" y="1288" class="bodySmall muted">compare authority, effect, evidence, and timing</text>
  <text x="2754" y="1324" class="bodySmall muted">name breaks explicitly; never rewrite history</text>

  <path d="M3310 970V1046H478V1104" fill="none" stroke="#b7c5d9" stroke-opacity="0.7" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M3310 970V1046H1376V1104" fill="none" stroke="#b7c5d9" stroke-opacity="0.7" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M3310 970V1046H2296V1104" fill="none" stroke="#b7c5d9" stroke-opacity="0.7" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M3310 970V1104" fill="none" stroke="#b7c5d9" stroke-opacity="0.7" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Evidence and scope -->
  <rect x="118" y="1450" width="3604" height="450" rx="24" fill="#04101f" stroke="#36506f" stroke-width="3"/>
  <text x="160" y="1512" class="section" fill="#f4f8ff">EVIDENCE MODEL / EXPLICIT AMBIGUITY / DISTINCT FINALITIES</text>
  <line x1="160" y1="1538" x2="3680" y2="1538" stroke="#36506f" stroke-width="2"/>

  <rect x="160" y="1580" width="880" height="248" rx="18" fill="#071426" stroke="#ff5964" stroke-opacity="0.74" stroke-width="2"/>
  <text x="196" y="1630" class="section" fill="#ff5964">AMBIGUITY IS STATE</text>
  <text x="196" y="1672" class="bodySmall muted">timeout / lost response is not a failed effect</text>
  <text x="196" y="1708" class="bodySmall muted">inquire by stable operation + attempt identity</text>
  <text x="196" y="1744" class="bodySmall muted">insufficient proof → MANUAL REVIEW</text>
  <text x="196" y="1808" class="micro" fill="#96e22a">NO BLIND RESUBMISSION — INQUIRE / REVIEW FIRST</text>

  <rect x="1080" y="1580" width="1420" height="248" rx="18" fill="#071426" stroke="#21d4ff" stroke-opacity="0.74" stroke-width="2"/>
  <text x="1116" y="1630" class="section" fill="#21d4ff">FOUR FINALITIES</text>
  <text x="1116" y="1672" class="bodySmall muted">Each has a separate append-only history; technical completion is not settlement.</text>
  <rect x="1116" y="1710" width="282" height="70" rx="14" fill="#0a203d"/><text x="1257" y="1754" class="micro" text-anchor="middle" fill="#21d4ff">BLOCKCHAIN</text>
  <rect x="1416" y="1710" width="282" height="70" rx="14" fill="#0a203d"/><text x="1557" y="1754" class="micro" text-anchor="middle" fill="#96e22a">ACCOUNTING</text>
  <rect x="1716" y="1710" width="282" height="70" rx="14" fill="#0a203d"/><text x="1857" y="1754" class="micro" text-anchor="middle" fill="#b35cff">LEGAL</text>
  <rect x="2016" y="1710" width="440" height="70" rx="14" fill="#0a203d"/><text x="2236" y="1754" class="micro" text-anchor="middle" fill="#ff8a22">CUSTOMER-VISIBLE</text>

  <rect x="2540" y="1580" width="1140" height="248" rx="18" fill="#071426" stroke="#96e22a" stroke-opacity="0.76" stroke-width="2"/>
  <text x="2576" y="1630" class="section" fill="#96e22a">REFERENCE IMPLEMENTATION</text>
  <text x="2576" y="1672" class="bodySmall muted">NON-PRODUCTION / LOCAL-ONLY EVIDENCE</text>
  <text x="2576" y="1710" class="bodySmall muted">verified through Phase 7E • Phase 7F demonstrations implemented</text>
  <text x="2576" y="1746" class="bodySmall muted">no production custody, public networks, or settlement claim</text>
  <text x="2576" y="1788" class="micro" fill="#96e22a">ARCHITECTURE + MODULE EVIDENCE / NOT DEPLOYMENT DOCUMENTATION</text>

  <path id="observation-to-inquiry" d="M3310 1396V1554H600V1600" fill="none" stroke="#96e22a" stroke-width="3" stroke-dasharray="12 10" marker-end="url(#limeArrow)"/>
  <text x="1670" y="1578" class="micro" fill="#96e22a">OBSERVATION → INQUIRY / MANUAL REVIEW</text>

  <line x1="118" y1="2052" x2="3722" y2="2052" stroke="#36506f" stroke-opacity="0.7" stroke-width="2"/>
  <text x="118" y="2106" class="footer" fill="#b7c5d9">JOHN WHITTON / ENGINEER. ARCHITECT. LEADER.</text>
  <text x="3722" y="2106" class="footer" fill="#96e22a" text-anchor="end">APPENDIX 03</text>
</svg>
