<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hydration and cache authority</title>
  <desc id="desc">A public-safe architecture diagram showing durable topology hydrating a warm catalogue while labelled live state independently controls evaluation coverage.</desc>
  <defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11z" fill="#406078"/></marker><style>.k{font:700 24px Arial,sans-serif;letter-spacing:4px;fill:#0f766e}.t{font:700 50px Arial,sans-serif;fill:#102a43}.s{font:400 28px Arial,sans-serif;fill:#486581}.h{font:700 27px Arial,sans-serif;fill:#102a43}.b{font:400 20px Arial,sans-serif;fill:#486581}.l{font:700 16px Arial,sans-serif;letter-spacing:1px;fill:#102a43}.f{font:600 25px Arial,sans-serif;fill:#fff}</style></defs>
  <rect width="1600" height="900" fill="#f4f8fa"/><text x="70" y="80" class="k">SALUS · WARM START</text><text x="70" y="148" class="t">Hydration recovers knowledge; live state grants coverage</text><text x="70" y="195" class="s">Durable records and current state solve different engineering questions.</text>
  <g fill="#fff" stroke-width="5"><rect x="80" y="305" width="350" height="230" rx="22" stroke="#0f766e"/><rect x="625" y="305" width="350" height="230" rx="22" stroke="#0f766e"/><rect x="1170" y="305" width="350" height="230" rx="22" stroke="#b7791f"/><rect x="625" y="625" width="350" height="120" rx="22" stroke="#b7791f"/></g><g stroke="#406078" stroke-width="8" marker-end="url(#arrow)"><path d="M430 420H605"/><path d="M975 420H1150"/><path d="M800 625V555"/><path d="M1170 500L1000 635"/></g>
  <g text-anchor="middle"><text x="255" y="373" class="h">Durable topology</text><text x="255" y="421" class="b"><tspan x="255">components, membership,</tspan><tspan x="255" dy="30">and route summaries</tspan></text><text x="255" y="498" class="l">RECOVERY / INSPECTION</text><text x="800" y="373" class="h">Warm catalogue</text><text x="800" y="421" class="b"><tspan x="800">in-memory route identities</tspan><tspan x="800" dy="30">and affected-route lookup</tspan></text><text x="800" y="498" class="l">IMPLEMENTED</text><text x="1345" y="373" class="h">Evaluation request</text><text x="1345" y="421" class="b"><tspan x="1345">only after coverage</tspan><tspan x="1345" dy="30">and freshness checks</tspan></text><text x="1345" y="498" class="l">VALIDATION LIMITS</text><text x="800" y="680" class="h">Labelled live state</text><text x="800" y="718" class="b">stream-owned; never replaced by storage</text></g>
  <rect x="70" y="790" width="1460" height="58" rx="18" fill="#102a43"/><text x="800" y="828" class="f" text-anchor="middle">Known topology is useful; current executable state is a separate authority.</text>
</svg>
