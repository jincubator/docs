<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Topology to affected-route evaluation</title>
  <desc id="desc">A public-safe diagram showing how topology recovery, catalogue hydration, component change, current-state coverage, and evaluation relate.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11z" fill="#406078"/></marker>
    <style>
      .kicker { font: 700 24px Arial, sans-serif; letter-spacing: 4px; fill: #0f766e; }
      .title { font: 700 50px Arial, sans-serif; fill: #102a43; }
      .subtitle { font: 400 28px Arial, sans-serif; fill: #486581; }
      .heading { font: 700 27px Arial, sans-serif; fill: #102a43; }
      .body { font: 400 21px Arial, sans-serif; fill: #486581; }
      .status { font: 700 16px Arial, sans-serif; letter-spacing: 1px; fill: #102a43; }
      .legend { font: 600 18px Arial, sans-serif; fill: #102a43; }
      .footer { font: 600 25px Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f4f8fa"/>
  <text x="70" y="80" class="kicker">SALUS · PUBLIC ARCHITECTURE</text>
  <text x="70" y="148" class="title">Topology to affected-route evaluation</text>
  <text x="70" y="195" class="subtitle">Durable topology supports recovery; the warm catalogue owns current membership.</text>
  <g transform="translate(1120 64)"><rect width="410" height="54" rx="12" fill="#ffffff" stroke="#c9d9e2"/><circle cx="30" cy="27" r="9" fill="#0f766e"/><text x="48" y="33" class="legend">Implemented</text><circle cx="185" cy="27" r="9" fill="#b7791f"/><text x="203" y="33" class="legend">Limits</text><circle cx="302" cy="27" r="9" fill="#6b7280"/><text x="320" y="33" class="legend">Future</text></g>
  <path d="M 325 395 H 341" stroke="#406078" stroke-width="8" fill="none" marker-end="url(#arrow)"/><g><rect x="55" y="270" width="270" height="260" rx="22" fill="#ffffff" stroke="#0f766e" stroke-width="5"/><rect x="55" y="270" width="270" height="12" rx="6" fill="#0f766e"/><text x="190" y="342" class="heading" text-anchor="middle">Persist</text><text x="190" y="395" class="body" text-anchor="middle"><tspan x="190" dy="0">topology and</tspan><tspan x="190" dy="30">inspectable records</tspan></text><text x="190" y="490" class="status" text-anchor="middle">IMPLEMENTED</text></g>
<path d="M 635 395 H 651" stroke="#406078" stroke-width="8" fill="none" marker-end="url(#arrow)"/><g><rect x="365" y="270" width="270" height="260" rx="22" fill="#ffffff" stroke="#0f766e" stroke-width="5"/><rect x="365" y="270" width="270" height="12" rx="6" fill="#0f766e"/><text x="500" y="342" class="heading" text-anchor="middle">Hydrate</text><text x="500" y="395" class="body" text-anchor="middle"><tspan x="500" dy="0">generation-aware</tspan><tspan x="500" dy="30">warm catalogue</tspan></text><text x="500" y="490" class="status" text-anchor="middle">IMPLEMENTED</text></g>
<path d="M 945 395 H 961" stroke="#406078" stroke-width="8" fill="none" marker-end="url(#arrow)"/><g><rect x="675" y="270" width="270" height="260" rx="22" fill="#ffffff" stroke="#0f766e" stroke-width="5"/><rect x="675" y="270" width="270" height="12" rx="6" fill="#0f766e"/><text x="810" y="342" class="heading" text-anchor="middle">Change</text><text x="810" y="395" class="body" text-anchor="middle"><tspan x="810" dy="0">component update</tspan><tspan x="810" dy="30">with source context</tspan></text><text x="810" y="490" class="status" text-anchor="middle">IMPLEMENTED</text></g>
<path d="M 1255 395 H 1271" stroke="#406078" stroke-width="8" fill="none" marker-end="url(#arrow)"/><g><rect x="985" y="270" width="270" height="260" rx="22" fill="#ffffff" stroke="#0f766e" stroke-width="5"/><rect x="985" y="270" width="270" height="12" rx="6" fill="#0f766e"/><text x="1120" y="342" class="heading" text-anchor="middle">Recall</text><text x="1120" y="395" class="body" text-anchor="middle"><tspan x="1120" dy="0">known affected</tspan><tspan x="1120" dy="30">route membership</tspan></text><text x="1120" y="490" class="status" text-anchor="middle">IMPLEMENTED</text></g>
<g><rect x="1295" y="270" width="270" height="260" rx="22" fill="#ffffff" stroke="#b7791f" stroke-width="5"/><rect x="1295" y="270" width="270" height="12" rx="6" fill="#b7791f"/><text x="1430" y="342" class="heading" text-anchor="middle">Evaluate</text><text x="1430" y="395" class="body" text-anchor="middle"><tspan x="1430" dy="0">current state</tspan><tspan x="1430" dy="30">or abstain</tspan></text><text x="1430" y="490" class="status" text-anchor="middle">VALIDATION LIMITS</text></g>
  <rect x="70" y="680" width="1460" height="105" rx="22" fill="#102a43"/>
  <text x="800" y="744" class="footer" text-anchor="middle">A stale cache or mismatched generation is a safe miss, not a substitute authority.</text>
  <text x="70" y="845" class="body">Jincubator review candidate · architecture abstraction · no operational configuration or strategy detail</text>
</svg>

