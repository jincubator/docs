<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Layered validation and evidence</title>
  <desc id="desc">A public-safe diagram showing configuration validation, topology inspection, replay, guarded dry run, and reconciliation as distinct validation layers.</desc>
  <defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11z" fill="#406078"/></marker><style>.k{font:700 24px Arial,sans-serif;letter-spacing:4px;fill:#0f766e}.t{font:700 50px Arial,sans-serif;fill:#102a43}.s{font:400 28px Arial,sans-serif;fill:#486581}.h{font:700 27px Arial,sans-serif;fill:#102a43}.b{font:400 20px Arial,sans-serif;fill:#486581}.l{font:700 16px Arial,sans-serif;letter-spacing:1px;fill:#102a43}.f{font:600 25px Arial,sans-serif;fill:#fff}</style></defs>
  <rect width="1600" height="900" fill="#f4f8fa"/><text x="70" y="80" class="k">SALUS · VALIDATION</text><text x="70" y="148" class="t">Different checks answer different questions</text><text x="70" y="195" class="s">Validation narrows a diagnosis; it does not collapse local behavior into external proof.</text>
  <g fill="#fff" stroke-width="5"><rect x="540" y="265" width="520" height="95" rx="20" stroke="#0f766e"/><rect x="470" y="395" width="660" height="95" rx="20" stroke="#0f766e"/><rect x="400" y="525" width="800" height="95" rx="20" stroke="#b7791f"/><rect x="330" y="655" width="940" height="95" rx="20" stroke="#b7791f"/></g><g stroke="#406078" stroke-width="7" marker-end="url(#arrow)"><path d="M800 360V380"/><path d="M800 490V510"/><path d="M800 620V640"/></g>
  <g text-anchor="middle"><text x="800" y="324" class="h">Configuration and target validation</text><text x="800" y="455" class="h">Topology inspection and deterministic tests</text><text x="800" y="585" class="h">Replay: labelled state, route scope, and modeled result</text><text x="800" y="715" class="h">Guarded dry run, preflight, reconciliation, or unresolved outcome</text></g>
  <text x="800" y="790" class="b" text-anchor="middle">Each layer retains its own boundary: coherent configuration ≠ live coverage; replay ≠ settlement.</text><rect x="70" y="820" width="1460" height="48" rx="16" fill="#102a43"/><text x="800" y="852" class="f" text-anchor="middle">The best diagnostic begins at the owner of the failed contract.</text>
</svg>
