<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 720">
  <title id="title">Reviewed Ethereum route-evaluation evidence</title>
  <desc id="desc">A current evidence summary shows 3,415 graph token nodes, 4,552 liquidity components, 2,401,108 maximum-four-hop routes, a 100-block trace with 486,934 evaluations across 83 services, 4,554 sustained and 7,528 peak evaluations per second, and zero after-gas routes selected in the latest cited retained runs.</desc>
  <style>
    .bg{fill:#f4f7fa}.navy{fill:#0d2d4c}.card{fill:#fff}.teal{stroke:#17858c}.blue{stroke:#3d73df}.amber{stroke:#dc961b}.purple{stroke:#765bb2}.label{font:700 25px system-ui,sans-serif;fill:#0d2d4c}.value{font:700 38px system-ui,sans-serif;fill:#0d2d4c}.small{font:20px system-ui,sans-serif;fill:#41678e}.note{font:700 23px system-ui,sans-serif;fill:#fff}
  </style>
  <rect class="bg" width="1200" height="720"/>
  <text x="60" y="65" class="small" style="font-weight:700;letter-spacing:4px;fill:#17858c">SALUS · REVIEWED ENGINEERING EVIDENCE</text>
  <text x="60" y="118" class="label" style="font-size:41px">Scale and throughput answer different questions</text>
  <rect class="card teal" x="50" y="165" width="255" height="150" rx="20" stroke-width="6"/>
  <text x="85" y="215" class="value">3,415</text><text x="85" y="258" class="small">Ethereum graph token nodes</text>
  <rect class="card teal" x="330" y="165" width="255" height="150" rx="20" stroke-width="6"/>
  <text x="365" y="215" class="value">4,552</text><text x="365" y="258" class="small">liquidity components</text>
  <rect class="card blue" x="610" y="165" width="255" height="150" rx="20" stroke-width="6"/>
  <text x="645" y="215" class="value">2,401,108</text><text x="645" y="258" class="small">max-four-hop route universe</text>
  <rect class="card purple" x="890" y="165" width="260" height="150" rx="20" stroke-width="6"/>
  <text x="925" y="215" class="value">100 blocks</text><text x="925" y="258" class="small">July 9, 2026 trace</text>
  <rect class="card" x="50" y="355" width="520" height="220" rx="22"/>
  <text x="90" y="405" class="label">Trace scope</text>
  <text x="90" y="455" class="value">486,934 evaluations</text>
  <text x="90" y="495" class="small">across 83 completed evaluation services</text>
  <text x="90" y="532" class="small">blocks 25,495,691–25,495,790</text>
  <rect class="card" x="600" y="355" width="550" height="220" rx="22"/>
  <text x="640" y="405" class="label">Evaluator service rate</text>
  <text x="640" y="455" class="value">4,554/s sustained</text>
  <text x="640" y="505" class="value" style="font-size:32px">7,528/s peak</text>
  <text x="640" y="542" class="small">service-time denominator · retained workload</text>
  <rect class="navy" x="50" y="620" width="1100" height="65" rx="20"/>
  <text x="600" y="648" text-anchor="middle" class="note">Latest cited retained runs selected zero after-gas routes.</text>
  <text x="600" y="676" text-anchor="middle" class="note">Capacity is not submission, settlement, or realized profit.</text>
</svg>
