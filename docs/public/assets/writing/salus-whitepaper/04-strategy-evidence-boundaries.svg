<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shared infrastructure and distinct strategy evidence</title>
  <desc id="desc">A diagram showing shared Salus infrastructure leading to separate arbitrage, liquidation, intent, portfolio, and market-making evidence contracts.</desc>
  <defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11z" fill="#406078"/></marker><style>.k{font:700 24px Arial,sans-serif;letter-spacing:4px;fill:#0f766e}.t{font:700 50px Arial,sans-serif;fill:#102a43}.s{font:400 28px Arial,sans-serif;fill:#486581}.h{font:700 26px Arial,sans-serif;fill:#102a43}.b{font:400 20px Arial,sans-serif;fill:#486581}.f{font:600 25px Arial,sans-serif;fill:#fff}</style></defs>
  <rect width="1600" height="900" fill="#f4f8fa"/><text x="70" y="80" class="k">SALUS · STRATEGY BOUNDARIES</text><text x="70" y="148" class="t">One runtime, separate economic questions</text><text x="70" y="195" class="s">Shared infrastructure reduces plumbing; it does not prove an operating strategy.</text>
  <rect x="465" y="275" width="670" height="155" rx="24" fill="#fff" stroke="#0f766e" stroke-width="5"/><text x="800" y="337" class="h" text-anchor="middle">Shared Salus infrastructure</text><text x="800" y="383" class="b" text-anchor="middle">topology · state · fixed-input evaluation · guarded execution · evidence</text>
  <g stroke="#406078" stroke-width="7" marker-end="url(#arrow)"><path d="M800 430V505H180V535"/><path d="M800 430V505H490V535"/><path d="M800 430V505H800V535"/><path d="M800 430V505H1110V535"/><path d="M800 430V505H1420V535"/></g>
  <g fill="#fff" stroke-width="5"><rect x="55" y="535" width="250" height="175" rx="20" stroke="#b7791f"/><rect x="365" y="535" width="250" height="175" rx="20" stroke="#6b7280"/><rect x="675" y="535" width="250" height="175" rx="20" stroke="#6b7280"/><rect x="985" y="535" width="250" height="175" rx="20" stroke="#6b7280"/><rect x="1295" y="535" width="250" height="175" rx="20" stroke="#6b7280"/></g>
  <g text-anchor="middle"><text x="180" y="594" class="h">Arbitrage</text><text x="180" y="637" class="b"><tspan x="180">exact route and</tspan><tspan x="180" dy="27">cost boundary</tspan></text><text x="490" y="594" class="h">Liquidation</text><text x="490" y="637" class="b"><tspan x="490">eligibility and</tspan><tspan x="490" dy="27">recovery boundary</tspan></text><text x="800" y="594" class="h">Intent solving</text><text x="800" y="637" class="b"><tspan x="800">user mandate and</tspan><tspan x="800" dy="27">settlement boundary</tspan></text><text x="1110" y="594" class="h">Portfolio</text><text x="1110" y="637" class="b"><tspan x="1110">inventory and</tspan><tspan x="1110" dy="27">risk boundary</tspan></text><text x="1420" y="594" class="h">Market making</text><text x="1420" y="637" class="b"><tspan x="1420">quote, inventory,</tspan><tspan x="1420" dy="27">and time boundary</tspan></text></g>
  <rect x="70" y="770" width="1460" height="68" rx="20" fill="#102a43"/><text x="800" y="814" class="f" text-anchor="middle">Architectural fit is not evidence of integration, deployment, or profitability.</text>
</svg>
