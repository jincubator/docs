<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-gated Salus roadmap</title>
  <desc id="desc">A public-safe roadmap showing stronger state evidence, protocol validation, strategy research, and outcome evidence as separate gates.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#406078"/></marker><style>.k{font:700 24px Arial,sans-serif;letter-spacing:4px;fill:#0f766e}.t{font:700 50px Arial,sans-serif;fill:#102a43}.s{font:400 28px Arial,sans-serif;fill:#486581}.h{font:700 27px Arial,sans-serif;fill:#102a43}.b{font:400 20px Arial,sans-serif;fill:#486581}.l{font:700 16px Arial,sans-serif;letter-spacing:1px;fill:#102a43}.f{font:600 25px Arial,sans-serif;fill:#fff}</style></defs>
  <rect width="1600" height="900" fill="#f4f8fa"/><text x="70" y="80" class="k">SALUS · FUTURE WORK</text><text x="70" y="148" class="t">Evidence advances a boundary, not a slogan</text><text x="70" y="195" class="s">Every future capability needs its own inputs, abstention rules, and independent outcome evidence.</text>
  <g fill="#fff" stroke-width="5"><rect x="70" y="300" width="330" height="270" rx="22" stroke="#0f766e"/><rect x="470" y="300" width="330" height="270" rx="22" stroke="#b7791f"/><rect x="870" y="300" width="330" height="270" rx="22" stroke="#6b7280"/><rect x="1270" y="300" width="260" height="270" rx="22" stroke="#6b7280"/></g><g stroke="#406078" stroke-width="4" marker-end="url(#arrow)"><path d="M400 435H450"/><path d="M800 435H850"/><path d="M1200 435H1250"/></g>
  <g text-anchor="middle"><text x="235" y="370" class="h">State and recovery</text><text x="235" y="423" class="b"><tspan x="235">coverage, refresh,</tspan><tspan x="235" dy="30">and bounded recovery</tspan></text><text x="235" y="525" class="l">EVIDENCE GATE</text><text x="635" y="370" class="h">Protocol validation</text><text x="635" y="423" class="b"><tspan x="635">simulation and</tspan><tspan x="635" dy="30">preflight contracts</tspan></text><text x="635" y="525" class="l">EVIDENCE GATE</text><text x="1035" y="370" class="h">Strategy research</text><text x="1035" y="423" class="b"><tspan x="1035">specific objective,</tspan><tspan x="1035" dy="30">costs, and abstention</tspan></text><text x="1035" y="525" class="l">PROPOSED / FUTURE</text><text x="1400" y="370" class="h">Outcome evidence</text><text x="1400" y="423" class="b"><tspan x="1400">independent later</tspan><tspan x="1400" dy="30">observation required</tspan></text><text x="1400" y="525" class="l">NOT ESTABLISHED</text></g>
  <rect x="70" y="680" width="1460" height="105" rx="22" fill="#102a43"/><text x="800" y="744" class="f" text-anchor="middle">A proposal does not become an implemented claim until its evidence reaches the relevant gate.</text><text x="70" y="845" class="b">Jincubator review candidate · future directions are not current operating capabilities</text>
</svg>
