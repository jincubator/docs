<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Changed component to evaluation</title>
  <desc id="desc">A changed component resolves to known affected routes through an in-memory index before bounded admission and evaluation.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#58718d"/></marker><style>.bg{fill:#f6f8fb}.h{font:700 48px Arial,sans-serif;fill:#102b46}.k{font:700 18px Arial,sans-serif;fill:#087f8f}.b{fill:#fff;stroke:#4e7fe3;stroke-width:3}.cache{fill:#eef8ef;stroke:#3b9d63;stroke-width:3}.warn{fill:#fff4dc;stroke:#e6a62f;stroke-width:3}.t{font:700 21px Arial,sans-serif;fill:#102b46}.s{font:400 17px Arial,sans-serif;fill:#496783}.a{stroke:#58718d;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1600" height="900"/><text x="80" y="80" class="k">SALUS · AFFECTED-ROUTE SELECTION</text><text x="80" y="142" class="h">Resolve the affected topology, not the whole universe.</text><text x="80" y="185" class="s">A cached acceleration path may help; the in-memory route membership remains authoritative.</text>
  <g><rect x="90" y="270" width="210" height="105" rx="16" class="b"/><text x="195" y="312" text-anchor="middle" class="t">State update</text><text x="195" y="342" text-anchor="middle" class="s">changed components</text><line x1="305" y1="322" x2="390" y2="322" class="a"/>
  <rect x="395" y="270" width="240" height="105" rx="16" class="b"/><text x="515" y="312" text-anchor="middle" class="t">Scope resolver</text><text x="515" y="342" text-anchor="middle" class="s">component membership</text><line x1="640" y1="322" x2="725" y2="322" class="a"/>
  <rect x="730" y="245" width="290" height="155" rx="18" class="cache"/><text x="875" y="290" text-anchor="middle" class="t">Optional hot cache</text><text x="875" y="320" text-anchor="middle" class="s">or authoritative</text><text x="875" y="350" text-anchor="middle" class="t">in-memory route index</text><line x1="1025" y1="322" x2="1110" y2="322" class="a"/>
  <rect x="1115" y="270" width="240" height="105" rx="16" class="b"/><text x="1235" y="312" text-anchor="middle" class="t">Affected union</text><text x="1235" y="342" text-anchor="middle" class="s">sorted route IDs</text><line x1="1360" y1="322" x2="1445" y2="322" class="a"/></g>
  <rect x="110" y="500" width="260" height="120" rx="16" class="warn"/><text x="240" y="545" text-anchor="middle" class="t">Candidate budget</text><text x="240" y="578" text-anchor="middle" class="s">bounded preparation</text><line x1="375" y1="560" x2="475" y2="560" class="a"/>
  <rect x="480" y="500" width="260" height="120" rx="16" class="b"/><text x="610" y="545" text-anchor="middle" class="t">Coverage check</text><text x="610" y="578" text-anchor="middle" class="s">current state required</text><line x1="745" y1="560" x2="845" y2="560" class="a"/>
  <rect x="850" y="500" width="260" height="120" rx="16" class="b"/><text x="980" y="545" text-anchor="middle" class="t">Evaluation request</text><text x="980" y="578" text-anchor="middle" class="s">block-scoped input</text><line x1="1115" y1="560" x2="1215" y2="560" class="a"/>
  <rect x="1220" y="500" width="260" height="120" rx="16" class="warn"/><text x="1350" y="545" text-anchor="middle" class="t">Bounded queue</text><text x="1350" y="578" text-anchor="middle" class="s">explicit admission</text>
  <rect x="90" y="720" width="1420" height="85" rx="18" fill="#102b46"/><text x="800" y="770" text-anchor="middle" style="font:700 26px Arial,sans-serif;fill:#fff">Changed component ≠ database query per route ≠ scan of every known route.</text>
</svg>
