<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Salus decision evidence lifecycle</title>
  <desc id="desc">A public-safe lifecycle from labelled state through scoped route and evaluation to guarded candidate and reconciled evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#406078"/></marker>
    <style>.k{font:700 24px Arial,sans-serif;letter-spacing:4px;fill:#0f766e}.t{font:700 50px Arial,sans-serif;fill:#102a43}.s{font:400 28px Arial,sans-serif;fill:#486581}.h{font:700 27px Arial,sans-serif;fill:#102a43}.b{font:400 20px Arial,sans-serif;fill:#486581}.l{font:700 16px Arial,sans-serif;letter-spacing:1px;fill:#102a43}.f{font:600 25px Arial,sans-serif;fill:#fff}</style>
  </defs>
  <rect width="1600" height="900" fill="#f4f8fa"/>
  <text x="70" y="80" class="k">SALUS · EVIDENCE LIFECYCLE</text><text x="70" y="148" class="t">A decision is narrowed before it is claimed</text><text x="70" y="195" class="s">Every stage retains a distinct identity, rejection path, and scope of authority.</text>
  <g stroke-width="5" fill="#fff"><rect x="55" y="300" width="260" height="235" rx="22" stroke="#0f766e"/><rect x="360" y="300" width="260" height="235" rx="22" stroke="#0f766e"/><rect x="665" y="300" width="260" height="235" rx="22" stroke="#b7791f"/><rect x="970" y="300" width="260" height="235" rx="22" stroke="#b7791f"/><rect x="1275" y="300" width="260" height="235" rx="22" stroke="#6b7280"/></g>
  <g stroke="#406078" stroke-width="4" marker-end="url(#arrow)"><path d="M315 417H345"/><path d="M620 417H650"/><path d="M925 417H955"/><path d="M1230 417H1260"/></g>
  <g text-anchor="middle"><text x="185" y="365" class="h">Labelled state</text><text x="185" y="420" class="b"><tspan x="185">observed change</tspan><tspan x="185" dy="30">and source identity</tspan></text><text x="185" y="495" class="l">IMPLEMENTED</text><text x="490" y="365" class="h">Scoped route</text><text x="490" y="420" class="b"><tspan x="490">known membership</tspan><tspan x="490" dy="30">and coverage check</tspan></text><text x="490" y="495" class="l">IMPLEMENTED</text><text x="795" y="365" class="h">Evaluation</text><text x="795" y="420" class="b"><tspan x="795">exact inputs</tspan><tspan x="795" dy="30">or typed abstention</tspan></text><text x="795" y="495" class="l">VALIDATION LIMITS</text><text x="1100" y="365" class="h">Guarded candidate</text><text x="1100" y="420" class="b"><tspan x="1100">freshness and</tspan><tspan x="1100" dy="30">preflight boundary</tspan></text><text x="1100" y="495" class="l">VALIDATION LIMITS</text><text x="1405" y="365" class="h">Reconciliation</text><text x="1405" y="420" class="b"><tspan x="1405">later independent</tspan><tspan x="1405" dy="30">evidence or unknown</tspan></text><text x="1405" y="495" class="l">NOT ESTABLISHED</text></g>
  <rect x="70" y="680" width="1460" height="105" rx="22" fill="#102a43"/><text x="800" y="744" class="f" text-anchor="middle">A route, model result, handoff, and outcome are never the same fact.</text><text x="70" y="845" class="b">Jincubator review candidate · public architecture abstraction · no operational detail</text>
</svg>
