<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 720">
  <title id="title">Queue transport and service-owned policy</title>
  <desc id="desc">A producer feeds a bounded queue and thin adapter into a service that owns freshness and ordering policy. Three cards distinguish freshness, durability, and execution queue semantics.</desc>
  <style>
    .bg{fill:#f4f7fa}.navy{fill:#0d2d4c}.box{fill:#fff;stroke:#3d73df;stroke-width:3}.service{stroke:#299461}.label{font:700 26px system-ui,sans-serif;fill:#0d2d4c}.small{font:20px system-ui,sans-serif;fill:#41678e}.card{fill:#fff}.accent1{stroke:#dc961b;stroke-width:7}.accent2{stroke:#3d73df;stroke-width:7}.accent3{stroke:#299461;stroke-width:7}.pill{font:700 20px system-ui,sans-serif;fill:#fff}.arrow{fill:none;stroke:#6a829a;stroke-width:5;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#6a829a"/></marker></defs>
  <rect class="bg" width="1200" height="720"/>
  <text x="60" y="65" class="small" style="font-weight:700;letter-spacing:4px;fill:#17858c">SALUS · QUEUE OWNERSHIP</text>
  <text x="60" y="118" class="label" style="font-size:41px">Queues transport work; services own policy</text>
  <path class="arrow" d="M270 245h50"/><path class="arrow" d="M600 245h50"/><path class="arrow" d="M930 245h50"/>
  <rect class="box" x="50" y="165" width="220" height="160" rx="20"/>
  <text x="160" y="215" text-anchor="middle" class="label">Producer</text><text x="160" y="260" text-anchor="middle" class="small">creates work with</text><text x="160" y="290" text-anchor="middle" class="small">state identity</text>
  <rect class="box" x="320" y="165" width="280" height="160" rx="20"/>
  <text x="460" y="215" text-anchor="middle" class="label">Bounded queue</text><text x="460" y="260" text-anchor="middle" class="small">capacity + lifecycle</text><text x="460" y="290" text-anchor="middle" class="small">observable pressure</text>
  <rect class="box service" x="650" y="165" width="280" height="160" rx="20"/>
  <text x="790" y="215" text-anchor="middle" class="label">Policy-owning service</text><text x="790" y="260" text-anchor="middle" class="small">freshness + ordering</text><text x="790" y="290" text-anchor="middle" class="small">domain decision</text>
  <rect class="box" x="980" y="165" width="170" height="160" rx="20"/>
  <text x="1065" y="215" text-anchor="middle" class="label">Output</text><text x="1065" y="260" text-anchor="middle" class="small">handoff or</text><text x="1065" y="290" text-anchor="middle" class="small">evidence</text>
  <rect class="card accent1" x="50" y="385" width="340" height="205" rx="20"/>
  <text x="85" y="430" class="label">Freshness work</text><text x="85" y="472" class="small">Favor the newest useful revision.</text><text x="85" y="505" class="small">Coalesce or discard superseded work.</text>
  <rect x="85" y="535" width="235" height="38" rx="19" fill="#dc961b"/><text x="202" y="562" text-anchor="middle" class="pill">latest useful work</text>
  <rect class="card accent2" x="430" y="385" width="340" height="205" rx="20"/>
  <text x="465" y="430" class="label">Durability work</text><text x="465" y="472" class="small">Drain committed work or record</text><text x="465" y="505" class="small">a visible incomplete outcome.</text>
  <rect x="465" y="535" width="230" height="38" rx="19" fill="#3d73df"/><text x="580" y="562" text-anchor="middle" class="pill">never disappear silently</text>
  <rect class="card accent3" x="810" y="385" width="340" height="205" rx="20"/>
  <text x="845" y="430" class="label">Execution handoff</text><text x="845" y="472" class="small">May require bounded ordering</text><text x="845" y="505" class="small">and continuous state evidence.</text>
  <rect x="845" y="535" width="220" height="38" rx="19" fill="#299461"/><text x="955" y="562" text-anchor="middle" class="pill">ordered when needed</text>
  <rect class="navy" x="50" y="630" width="1100" height="55" rx="18"/>
  <text x="600" y="667" text-anchor="middle" class="pill">Measure depth · wait · service time · utilization · stale work · drops · shutdown</text>
</svg>
