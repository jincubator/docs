<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Freshness and stale-work cancellation</title><desc id="desc">A newer block supersedes older evaluation work through separate admission, replacement, cancellation, and final result checks.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#58718d"/></marker><style>.bg{fill:#f6f8fb}.h{font:700 48px Arial,sans-serif;fill:#102b46}.k{font:700 18px Arial,sans-serif;fill:#087f8f}.b{fill:#fff;stroke:#4e7fe3;stroke-width:3}.new{fill:#eef8ef;stroke:#3b9d63;stroke-width:3}.old{fill:#fff4dc;stroke:#e6a62f;stroke-width:3}.t{font:700 21px Arial,sans-serif;fill:#102b46}.s{font:400 17px Arial,sans-serif;fill:#496783}.a{stroke:#58718d;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1600" height="900"/><text x="80" y="80" class="k">SALUS · FRESHNESS CONTROL</text><text x="80" y="142" class="h">Backpressure is not cancellation.</text><text x="80" y="185" class="s">Different mechanisms control new admission, redundant pending work, running work, and final authority.</text>
  <rect x="100" y="280" width="250" height="110" rx="16" class="old"/><text x="225" y="325" text-anchor="middle" class="t">Block N work</text><text x="225" y="355" text-anchor="middle" class="s">queued or running</text><line x1="355" y1="335" x2="470" y2="335" class="a"/>
  <rect x="475" y="280" width="260" height="110" rx="16" class="b"/><text x="605" y="325" text-anchor="middle" class="t">Freshness check</text><text x="605" y="355" text-anchor="middle" class="s">latest-state marker</text><line x1="740" y1="335" x2="855" y2="335" class="a"/>
  <rect x="860" y="280" width="260" height="110" rx="16" class="old"/><text x="990" y="325" text-anchor="middle" class="t">Stale?</text><text x="990" y="355" text-anchor="middle" class="s">source state superseded</text>
  <line x1="990" y1="395" x2="990" y2="500" class="a"/><rect x="850" y="510" width="280" height="110" rx="16" class="old"/><text x="990" y="553" text-anchor="middle" class="t">Cooperative stop</text><text x="990" y="584" text-anchor="middle" class="s">do not add stale authority</text>
  <rect x="100" y="690" width="310" height="105" rx="16" class="new"/><text x="255" y="730" text-anchor="middle" class="t">Backpressure</text><text x="255" y="760" text-anchor="middle" class="s">controls new admission</text>
  <rect x="465" y="690" width="310" height="105" rx="16" class="new"/><text x="620" y="730" text-anchor="middle" class="t">Replacement</text><text x="620" y="760" text-anchor="middle" class="s">removes redundant pending work</text>
  <rect x="1190" y="690" width="310" height="105" rx="16" class="new"/><text x="1345" y="730" text-anchor="middle" class="t">Post-compute guard</text><text x="1345" y="760" text-anchor="middle" class="s">stale result cannot select</text>
  <line x1="1125" y1="565" x2="1185" y2="700" class="a"/><text x="1200" y="530" class="s">A newer block updates the marker; useful current work continues.</text>
</svg>
