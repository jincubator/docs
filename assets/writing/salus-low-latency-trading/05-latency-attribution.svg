<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Latency attribution</title><desc id="desc">End-to-end decision latency is separated into queue wait, preparation, CPU evaluation, finalization, handoff, and external wait.</desc>
  <defs><style>.bg{fill:#f6f8fb}.h{font:700 48px Arial,sans-serif;fill:#102b46}.k{font:700 18px Arial,sans-serif;fill:#087f8f}.t{font:700 22px Arial,sans-serif;fill:#102b46}.s{font:400 18px Arial,sans-serif;fill:#496783}.i{fill:#dceaff;stroke:#4e7fe3;stroke-width:3}.c{fill:#fff4dc;stroke:#e6a62f;stroke-width:3}.e{fill:#eef8ef;stroke:#3b9d63;stroke-width:3}</style></defs>
  <rect class="bg" width="1600" height="900"/><text x="80" y="80" class="k">SALUS · LATENCY ATTRIBUTION</text><text x="80" y="142" class="h">Optimise the boundary that is actually waiting.</text><text x="80" y="185" class="s">An end-to-end number is a composition of internal capacity, useful computation, and external dependency time.</text>
  <text x="100" y="275" class="t">END-TO-END DECISION LATENCY</text>
  <rect x="100" y="320" width="265" height="135" rx="18" class="i"/><text x="232" y="372" text-anchor="middle" class="t">Queue wait</text><text x="232" y="405" text-anchor="middle" class="s">internal capacity</text>
  <rect x="390" y="320" width="265" height="135" rx="18" class="i"/><text x="522" y="372" text-anchor="middle" class="t">Preparation</text><text x="522" y="405" text-anchor="middle" class="s">request build</text>
  <rect x="680" y="320" width="265" height="135" rx="18" class="c"/><text x="812" y="372" text-anchor="middle" class="t">Evaluation</text><text x="812" y="405" text-anchor="middle" class="s">useful CPU work</text>
  <rect x="970" y="320" width="265" height="135" rx="18" class="i"/><text x="1102" y="372" text-anchor="middle" class="t">Finalization</text><text x="1102" y="405" text-anchor="middle" class="s">selection guard</text>
  <rect x="1260" y="320" width="240" height="135" rx="18" class="e"/><text x="1380" y="372" text-anchor="middle" class="t">External wait</text><text x="1380" y="405" text-anchor="middle" class="s">network / receipt</text>
  <rect x="100" y="570" width="430" height="145" rx="18" class="i"/><text x="135" y="620" class="t">Waiting for internal capacity</text><text x="135" y="657" class="s">Review admission, queue depth, stale work,</text><text x="135" y="684" class="s">and bounded worker availability.</text>
  <rect x="585" y="570" width="430" height="145" rx="18" class="c"/><text x="620" y="620" class="t">Doing useful CPU work</text><text x="620" y="657" class="s">Profile chunks, simulation, pricing,</text><text x="620" y="684" class="s">allocation, and deterministic merge.</text>
  <rect x="1070" y="570" width="430" height="145" rx="18" class="e"/><text x="1105" y="620" class="t">Waiting on an external dependency</text><text x="1105" y="657" class="s">Measure provider, network, and receipt</text><text x="1105" y="684" class="s">boundaries before changing evaluator code.</text>
  <text x="800" y="815" text-anchor="middle" style="font:700 26px Arial,sans-serif;fill:#102b46">High throughput does not identify the bottleneck; attributed latency does.</text>
</svg>
