<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CPU evaluation and asynchronous input output boundary</title>
  <desc id="desc">A public-safe diagram showing asynchronous stream and execution coordination around a bounded deterministic CPU evaluation pool.</desc>
  <defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11z" fill="#406078"/></marker><style>.k{font:700 24px Arial,sans-serif;letter-spacing:4px;fill:#0f766e}.t{font:700 50px Arial,sans-serif;fill:#102a43}.s{font:400 28px Arial,sans-serif;fill:#486581}.h{font:700 27px Arial,sans-serif;fill:#102a43}.b{font:400 20px Arial,sans-serif;fill:#486581}.l{font:700 16px Arial,sans-serif;letter-spacing:1px;fill:#102a43}.f{font:600 25px Arial,sans-serif;fill:#fff}</style></defs>
  <rect width="1600" height="900" fill="#f4f8fa"/><text x="70" y="80" class="k">SALUS · CONCURRENCY</text><text x="70" y="148" class="t">Asynchronous I/O coordinates; bounded workers compute</text><text x="70" y="195" class="s">Ownership boundaries prevent I/O waits and CPU work from becoming hidden policy.</text>
  <g fill="#fff" stroke-width="5"><rect x="70" y="310" width="300" height="210" rx="22" stroke="#0f766e"/><rect x="470" y="310" width="300" height="210" rx="22" stroke="#0f766e"/><rect x="870" y="310" width="300" height="210" rx="22" stroke="#b7791f"/><rect x="1270" y="310" width="260" height="210" rx="22" stroke="#b7791f"/></g><g stroke="#406078" stroke-width="8" marker-end="url(#arrow)"><path d="M370 415H450"/><path d="M770 415H850"/><path d="M1170 415H1250"/></g>
  <g text-anchor="middle"><text x="220" y="375" class="h">Stream and I/O</text><text x="220" y="421" class="b"><tspan x="220">labelled input, timers,</tspan><tspan x="220" dy="29">and lifecycle signals</tspan></text><text x="220" y="487" class="l">ASYNC OWNER</text><text x="620" y="375" class="h">Bounded admission</text><text x="620" y="421" class="b"><tspan x="620">typed requests, queue</tspan><tspan x="620" dy="29">wait, cancellation</tspan></text><text x="620" y="487" class="l">RUNTIME OWNER</text><text x="1020" y="375" class="h">CPU evaluation</text><text x="1020" y="421" class="b"><tspan x="1020">fixed inputs, chunks,</tspan><tspan x="1020" dy="29">deterministic merge</tspan></text><text x="1020" y="487" class="l">WORKER OWNER</text><text x="1400" y="375" class="h">Guarded handoff</text><text x="1400" y="421" class="b"><tspan x="1400">preflight and later</tspan><tspan x="1400" dy="29">external I/O only</tspan></text><text x="1400" y="487" class="l">EXECUTION OWNER</text></g>
  <rect x="95" y="630" width="1410" height="120" rx="22" fill="#fff" stroke="#c9d9e2" stroke-width="3"/><text x="800" y="685" class="h" text-anchor="middle">Observable signals: queue wait · service time · worker utilization · stale work · typed results</text><text x="800" y="725" class="b" text-anchor="middle">The architecture does not turn a high evaluation rate into an external outcome claim.</text>
  <rect x="70" y="795" width="1460" height="55" rx="18" fill="#102a43"/><text x="800" y="832" class="f" text-anchor="middle">A worker owns a computation, never the whole live runtime.</text>
</svg>
